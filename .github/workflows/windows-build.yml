name: Windows VST3 构建

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SanMu EQ'
      - 'SanMu EQ/**'
      - 'SanMu Comp'
      - 'SanMu Comp/**'
      - 'SanMu Delay'
      - 'SanMu Delay/**'
      - 'SanMu Reverb'
      - 'SanMu Reverb/**'
      - 'packaging/**'
      - '.github/workflows/windows-build.yml'
      - '.gitmodules'
      - 'CMakeLists.txt'

# 工作流只读取源码，不提交代码、不创建公开发行版、不上传网站。
permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vst3:
    name: ${{ matrix.product }} · Windows x64 VST3
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        product: [EQ6, Comp, Delay, Reverb]
    defaults:
      run:
        shell: pwsh
    env:
      SANMU_PRODUCT: ${{ matrix.product }}
      SANMU_WEBVIEW2_VERSION: '1.0.3485.44'

    steps:
      # 固定完整提交 SHA，避免标签移动时构建工具悄然变化。
      - name: 获取同一版本源码及递归子模块
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: 准备 Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false

      - name: 准备 Inno Setup 6 安装器编译器
        run: |
          choco install innosetup --no-progress -y

      - name: 建立产物和日志目录
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP "sanmu-artifacts\$env:SANMU_PRODUCT"
          $logs = Join-Path $env:RUNNER_TEMP "sanmu-logs\$env:SANMU_PRODUCT"
          New-Item -ItemType Directory -Force -Path $output, $logs | Out-Null
          @{
            commit = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            product = $env:SANMU_PRODUCT
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            webView2Sdk = $env:SANMU_WEBVIEW2_VERSION
            platform = 'Windows x64'
            signatureStatus = 'unsigned'
            hostValidation = 'pending'
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $output 'source-version.json')

      - name: 准备 WebView2 SDK 并构建 VST3 安装程序与压缩包
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP "sanmu-artifacts\$env:SANMU_PRODUCT"
          $logs = Join-Path $env:RUNNER_TEMP "sanmu-logs\$env:SANMU_PRODUCT"
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'sanmu-webview2'
          Start-Transcript -Path (Join-Path $logs 'build.log') -Force
          try {
            $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\build_sanmu_windows.ps1'
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Host
              throw 'Windows 构建脚本存在语法错误。'
            }
            if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
              throw '构建机器缺少 NuGet CLI。'
            }
            cmake --version
            node --version
            npm.cmd --version
            git submodule status --recursive
            if ($LASTEXITCODE -ne 0) { throw '读取子模块版本失败。' }

            # 只安装开发用 SDK。用户电脑需要的是 WebView2 Runtime，二者不同。
            nuget install Microsoft.Web.WebView2 `
              -Version $env:SANMU_WEBVIEW2_VERSION `
              -OutputDirectory $sdkRoot `
              -Source 'https://api.nuget.org/v3/index.json' `
              -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw '下载指定版本的 WebView2 SDK 失败。' }

            & $scriptPath `
              -Root $env:GITHUB_WORKSPACE `
              -Products $env:SANMU_PRODUCT `
              -Output $output `
              -WebView2PackageLocation $sdkRoot
          } finally {
            Stop-Transcript
          }

      - name: 保留 CMake 诊断记录
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP "sanmu-logs\$env:SANMU_PRODUCT"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "windows-build\$env:SANMU_PRODUCT"
          if (Test-Path $buildDir) {
            Get-ChildItem $buildDir -Recurse -File -Include CMakeConfigureLog.yaml, CMakeError.log, CMakeOutput.log |
              ForEach-Object {
                $relative = $_.FullName.Substring($buildDir.Length).TrimStart('\', '/')
                $destination = Join-Path $logs $relative
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
                Copy-Item $_.FullName $destination
              }
          }

      - name: 保存该插件内测包和校验记录
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SanMu-${{ matrix.product }}-Windows-x64-VST3-${{ github.run_id }}
          path: ${{ runner.temp }}/sanmu-artifacts/${{ matrix.product }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: 保存该插件构建日志
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SanMu-${{ matrix.product }}-Windows-build-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/sanmu-logs/${{ matrix.product }}/
          if-no-files-found: warn
          retention-days: 30

      - name: 写入测试提示
        if: success()
        run: |
          @"
          ## $env:SANMU_PRODUCT Windows VST3 安装包与便携包

          - 源码提交：$env:GITHUB_SHA
          - 已生成双击一键安装向导 (.exe) 与绿色便携包 (.zip)。
          - 构建结果与 SHA256 已随产物保存。
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  suite:
    name: SanMu Audio 4合1 Windows 安装包
    needs: vst3
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 获取源码及许可
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 准备 Inno Setup 6 安装器编译器
        run: |
          choco install innosetup --no-progress -y

      - name: 下载四款插件构建产物
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/downloaded-artifacts

      - name: 编译四合一安装程序
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'sanmu-suite-output'
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $stage = Join-Path $env:RUNNER_TEMP 'suite-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'downloaded-artifacts') -Recurse -Filter '*.zip' | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath (Join-Path $stage $_.BaseName) -Force
          }

          $eq6Vst3 = (Get-ChildItem -Path $stage -Recurse -Directory -Filter 'SanMu EQ6.vst3')[0].FullName
          $compVst3 = (Get-ChildItem -Path $stage -Recurse -Directory -Filter 'SanMu Comp.vst3')[0].FullName
          $delayVst3 = (Get-ChildItem -Path $stage -Recurse -Directory -Filter 'SanMu Delay.vst3')[0].FullName
          $reverbVst3 = (Get-ChildItem -Path $stage -Recurse -Directory -Filter 'SanMu Reverb.vst3')[0].FullName

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $suiteIss = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\suite_installer.iss'
          $license = Join-Path $env:GITHUB_WORKSPACE 'LICENSE'

          & $iscc `
            "/DMyAppVersion=1.0.0" `
            "/DMyOutputDir=$output" `
            "/DMyEq6Dir=$eq6Vst3" `
            "/DMyCompDir=$compVst3" `
            "/DMyDelayDir=$delayVst3" `
            "/DMyReverbDir=$reverbVst3" `
            "/DMyLicenseFile=$license" `
            $suiteIss

          $suiteExe = Join-Path $output 'SanMu_Audio_Suite_v1.0.0_Windows_x64_Installer.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $suiteExe).Hash.ToLowerInvariant()
          "$hash  SanMu_Audio_Suite_v1.0.0_Windows_x64_Installer.exe" | Set-Content -Encoding ASCII (Join-Path $output 'SHA256SUMS.txt')

      - name: 保存四合一安装包
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SanMu-Audio-Suite-Windows-Installer-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/sanmu-suite-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
