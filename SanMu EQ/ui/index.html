<!doctype html>
<html lang="zh" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:"><title>SanMu EQ</title><link rel="stylesheet" href="shared/reverb.css"><link rel="stylesheet" href="eq.css"></head>
<body><div id="app"><main class="instrument" data-family="2">
<header class="topbar">
  <div class="brand"><div class="brand-wordmark"><strong>SanMu</strong><span class="brand-product">EQ</span></div><div class="brand-audio" aria-label="Audio"><span>A</span><span>u</span><span>d</span><span>i</span><span>o</span></div></div>
  <div class="preset-control"><button id="preset-prev" class="icon-button" data-icon="chevron-left" data-tip="上一个预设"></button><button id="preset-open" class="preset-open" data-tip="预设"><span id="preset-name">Default Settings</span><span id="preset-dirty" hidden>·</span><i data-icon="chevron-down"></i></button><button id="preset-next" class="icon-button" data-icon="chevron-right" data-tip="下一个预设"></button><button id="preset-save" class="icon-button" data-icon="save" data-tip="保存预设"></button></div>
  <div class="tools"><div class="history-tools"><button id="undo" class="icon-button" data-icon="undo" data-tip="撤销"></button><button id="redo" class="icon-button" data-icon="redo" data-tip="重做"></button></div><fieldset class="compare" aria-label="A/B"><label><input type="radio" name="ab" value="A" checked><span>A</span></label><label><input type="radio" name="ab" value="B"><span>B</span></label></fieldset><button id="copy-ab" class="icon-button" data-icon="copy" data-tip="复制到另一快照"></button><span class="tool-divider"></span><button id="auto-gain" class="icon-button" aria-pressed="false" data-icon="gainMatch" data-tip="自动增益补偿" aria-label="自动增益补偿"></button><button id="phase-invert" class="icon-button" aria-pressed="false" data-icon="polarity" data-tip="极性反转" aria-label="极性反转"></button><button id="bypass" class="icon-button power" aria-pressed="false" data-tip="整体旁通">BYP</button><button id="settings" class="icon-button" data-icon="settings" data-tip="设置"></button></div>
</header>
<div class="modebar"><fieldset class="families processing-modes" aria-label="音色模式"><label data-tip="精确均衡，保持信号干净"><input type="radio" name="mode" value="0" checked><span>Clean</span></label><label data-tip="非对称软饱和，增加偶次谐波"><input type="radio" name="mode" value="1"><span>Tube</span></label><label data-tip="对称软饱和，轻微柔化峰值"><input type="radio" name="mode" value="2"><span>Discrete</span></label></fieldset><output id="track-name" hidden></output><div class="plot-options"><button id="spectrum" class="icon-button spectrum-toggle" aria-pressed="true" data-tip="频谱" aria-label="频谱"><span data-i18n="频谱">频谱</span></button><button id="range" class="text-menu" aria-haspopup="menu"><span>±12 dB</span><i data-icon="chevron-down"></i></button><button id="band-list" class="icon-button" data-icon="list" data-tip="频段列表"></button><button id="add-band" class="icon-button" data-icon="plus" data-tip="添加频段"></button></div></div>
<section class="sound-section"><div class="stage"><canvas id="response" aria-label="频响曲线"></canvas><div id="nodes"></div><output id="cursor-value" hidden></output><span id="band-count">6 / 24</span></div><aside class="eq-meters" role="button" tabindex="0" aria-label="输出电平，点击清除峰值" data-tip="点击电平表清除峰值"><div class="meter-titles"><span>L</span><span>R</span></div><div class="meter-body"><div class="meter-scale"><span>0</span><span>−12</span><span>−24</span><span>−36</span><span>−48</span><span>−60</span></div><div class="meter"><div class="meter-fill" id="meter-l"></div><div class="peak-line" id="peak-l"></div></div><div class="meter"><div class="meter-fill" id="meter-r"></div><div class="peak-line" id="peak-r"></div></div></div><div class="meter-readings"><output id="level-l">−∞</output><output id="level-r">−∞</output></div></aside></section>
<nav class="band-strip" aria-label="活动频段"><span data-i18n="频段">频段</span><div id="band-tabs" role="tablist"></div></nav>
<section class="selected-controls"><div id="inspector-type" class="parameter-picker"></div><div id="frequency-knob"></div><div id="gain-knob"></div><div id="q-knob"></div><div id="inspector-placement" class="parameter-picker"></div><p id="empty-state" hidden data-i18n="未选择频段">未选择频段</p></section>
<section class="details"><div class="input-group"><div id="input-knob"></div><div id="slope-knob"></div></div><section class="dynamic-controls" aria-label="动态均衡"><div class="dynamic-heading"><button id="band-dynamic" class="inline-toggle" aria-pressed="false" data-tip="动态均衡"><i data-icon="power"></i><span data-i18n="动态均衡">动态均衡</span></button><div class="threshold-mode" role="group" aria-label="阈值模式"><button id="dyn-auto" aria-pressed="true">AUTO</button><button id="dyn-manual" aria-pressed="false">MANUAL</button></div><div class="threshold-mode" role="group" aria-label="动态方向"><button id="dyn-down" aria-pressed="true" data-i18n="向下">向下</button><button id="dyn-up" aria-pressed="false" data-i18n="向上">向上</button></div><span id="dynamic-status"></span></div><div id="threshold-knob"></div><div id="range-knob"></div><div class="dynamic-meter-stack"><div class="detector-meter" role="meter" aria-label="带内触发电平" aria-valuemin="-90" aria-valuemax="6"><span data-i18n="触发">触发</span><div class="detector-track"><i id="detector-fill"></i><i id="detector-threshold"></i></div><output id="detector-level">−∞</output></div><div class="gr-meter" role="meter" aria-label="动态增益变化" aria-valuemin="-24" aria-valuemax="24"><div class="gr-heading"><span>GR</span><output id="band-dyn-meter">0.0 dB</output></div><div class="dynamic-bar"><i id="dynamic-fill"></i><i id="dynamic-limit"></i></div><div class="gr-scale"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div></div></section><div class="output-group"><button class="icon-button" id="output-link" aria-pressed="true" data-icon="link" data-tip="输出联动" aria-label="输出联动"></button><div id="output-l-knob"></div><div id="output-r-knob"></div></div></section>
<dialog id="settings-dialog"><div class="dialog-heading"><h2 data-i18n="设置">设置</h2><button class="icon-button close" data-icon="x" data-tip="关闭"></button></div><fieldset class="setting-group linear-phase-settings"><legend data-i18n="线性相位处理">线性相位处理</legend><div class="analyser-switches"><button id="linear-phase-toggle" aria-pressed="false" data-i18n="启用">启用</button><label class="linear-quality-select"><span data-i18n="精度">精度</span><select id="linear-quality"><option value="0" data-i18n="日常">日常</option><option value="1" data-i18n="高精度">高精度</option><option value="2" data-i18n="极限">极限</option></select></label></div><p id="linear-latency-note" class="analyser-note"></p></fieldset><fieldset class="setting-group"><legend data-i18n="外观">外观</legend><div class="setting-options theme-options"><label><input type="radio" name="theme" value="light" checked><span><i class="theme-swatch light"></i><b data-i18n="浅色">浅色</b></span></label><label><input type="radio" name="theme" value="dark"><span><i class="theme-swatch dark"></i><b data-i18n="深色">深色</b></span></label></div></fieldset><fieldset class="setting-group"><legend data-i18n="界面语言">界面语言</legend><div class="setting-options"><label><input type="radio" name="language" value="en"><span>English</span></label><label><input type="radio" name="language" value="zh" checked><span>中文</span></label></div></fieldset><fieldset class="setting-group"><legend data-i18n="窗口 · 界面缩放">窗口 · 界面缩放</legend><div class="setting-options scale-options"><label><input type="radio" name="scale" value="0.85"><span>85%</span></label><label><input type="radio" name="scale" value="1" checked><span>100%</span></label><label><input type="radio" name="scale" value="1.15"><span>115%</span></label><label><input type="radio" name="scale" value="1.25"><span>125%</span></label><label><input type="radio" name="scale" value="1.5"><span>150%</span></label></div></fieldset><fieldset class="setting-group"><legend data-i18n="悬停提示">悬停提示</legend><div class="setting-options tooltip-options"><label><input type="radio" name="tips" value="follow" checked><span data-i18n="跟随界面">跟随界面</span></label><label><input type="radio" name="tips" value="zh"><span>中文</span></label><label><input type="radio" name="tips" value="en"><span>English</span></label><label><input type="radio" name="tips" value="off"><span data-i18n="关闭">关闭</span></label></div></fieldset><div class="setting-links"><button id="help"><b data-i18n="帮助手册">帮助手册</b><span aria-hidden="true">↗</span></button><button id="about"><b data-i18n="关于 SanMu Audio">关于 SanMu Audio</b><span aria-hidden="true">↗</span></button></div></dialog>
<dialog id="help-dialog" class="info-dialog"><div class="dialog-heading"><h2 data-i18n="帮助手册">帮助手册</h2><button class="icon-button close" data-icon="x" data-tip="关闭"></button></div><div id="manual-content"></div><button class="back-settings" data-i18n="返回设置">返回设置</button></dialog><dialog id="about-dialog" class="info-dialog"><div class="dialog-heading"><h2 data-i18n="关于 SanMu Audio">关于 SanMu Audio</h2><button class="icon-button close" data-icon="x" data-tip="关闭"></button></div><div class="about-brand"><strong>SanMu EQ6</strong><span>0.1.5 · Beta · 2026-10-31</span></div><p data-i18n="最多 24 段的动态均衡器">最多 24 段的动态均衡器</p><p>Clean · Tube · Discrete · Linear Phase</p><button class="back-settings" data-i18n="返回设置">返回设置</button></dialog><dialog id="presets-dialog"><div class="dialog-heading"><h2 data-i18n="预设">预设</h2><button class="icon-button close" data-icon="x" data-tip="关闭"></button></div><input id="preset-search" type="search" aria-label="搜索预设"><div id="preset-list"></div></dialog>
<dialog id="save-dialog"><div class="dialog-heading"><h2 data-i18n="保存预设">保存预设</h2><button class="icon-button close" data-icon="x" data-tip="关闭"></button></div><form id="save-form"><input id="save-name" maxlength="60" required aria-label="预设名称"><p id="save-error" role="alert"></p><button class="primary" type="submit" data-i18n="保存">保存</button></form></dialog>
<dialog id="bands-dialog"><div class="dialog-heading"><h2 data-i18n="频段列表">频段列表</h2><button class="icon-button close" data-icon="x" data-tip="关闭"></button></div><div class="band-table-scroll"><table><thead><tr><th>#</th><th data-i18n="滤波类型">滤波类型</th><th data-i18n="频率">频率</th><th data-i18n="增益">增益</th><th>Q</th><th data-i18n="声道">声道</th><th data-i18n="状态">状态</th><th></th></tr></thead><tbody id="band-rows"></tbody></table></div></dialog>
<div id="range-menu" role="menu" hidden><button role="menuitemradio" data-range="auto">Auto</button><button role="menuitemradio" data-range="12">±12 dB</button><button role="menuitemradio" data-range="24">±24 dB</button><button role="menuitemradio" data-range="30">±30 dB</button></div>
</main><p id="notification" role="status" hidden></p><div id="tooltip" role="tooltip" hidden></div></div><script type="module" src="app.js"></script></body></html>
